services:
  - type: web
    name: student-party-chatbot-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODELS
        value: llama-3.3-70b-versatile,llama-3.1-8b-instant,gemma2-9b-it
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: RATE_LIMIT_MAX
        value: 40
      - key: ALLOWED_ORIGINS
        sync: false
